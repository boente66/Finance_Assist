name: Publicar rebuild autorizado test.17

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: SHA completo dos builds aprovados
        required: true
      asset_suffix:
        description: Sufixo dos novos arquivos sem alterar a versão
        required: true
      multiplatform_run:
        description: Run ID multiplataforma aprovado
        required: true
      ubuntu24_run:
        description: Run ID Ubuntu 24 aprovado
        required: true
      full_passed:
        description: Quantidade de testes aprovados na regressão completa
        required: true
      focused_passed:
        description: Quantidade de testes focados aprovados
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-invoice-rebuild-test17
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar e publicar os artefatos aprovados
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ASSET_SUFFIX: ${{ inputs.asset_suffix }}
          MULTIPLATFORM_RUN: ${{ inputs.multiplatform_run }}
          UBUNTU24_RUN: ${{ inputs.ubuntu24_run }}
          FULL_PASSED: ${{ inputs.full_passed }}
          FOCUSED_PASSED: ${{ inputs.focused_passed }}
        run: python packaging/publish_test_rebuild.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: publicacao-${{ inputs.asset_suffix }}
          path: |
            ${{ runner.temp }}/${{ inputs.asset_suffix }}/verification.json
            ${{ runner.temp }}/${{ inputs.asset_suffix }}/publish/${{ inputs.asset_suffix }}-manifest.json
          if-no-files-found: warn
