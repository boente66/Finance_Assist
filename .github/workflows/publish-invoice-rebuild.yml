name: Publicar painel de fatura homologado test.17

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-invoice-rebuild-test17
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar e publicar os artefatos aprovados
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish_test_rebuild.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: painel-fatura-publicacao-20261116
          path: |
            ${{ runner.temp }}/painel-fatura-20261116/verification.json
            ${{ runner.temp }}/painel-fatura-20261116/publish/painel-fatura-20261116-manifest.json
          if-no-files-found: warn
