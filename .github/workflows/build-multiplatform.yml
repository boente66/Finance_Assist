name: Build multiplataforma de teste

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-test.*"

permissions:
  contents: read

jobs:
  linux-compatibility:
    name: Ubuntu ${{ matrix.ubuntu }} - código
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências Qt de execução
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libfontconfig1 libgl1 libglib2.0-0 libx11-6 libxcb1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxext6 libxkbcommon-x11-0 libxrender1
      - name: Ambiente Python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest
      - name: Suíte completa isolada
        env:
          QT_QPA_PLATFORM: offscreen
          FINANCE_ASSIST_ENV: test
          FINANCE_ASSIST_DATA_DIR: ${{ runner.temp }}/finance-assist-tests
        run: .venv/bin/python -m pytest -q

  linux-deb:
    name: Ubuntu 22.04 - DEB amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libdbus-1-3 libfontconfig1 libgl1 libglib2.0-0 libx11-6 libxcb1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxext6 libxkbcommon-x11-0 libxrender1
      - name: Ambiente Python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest
      - name: Testes de empacotamento
        run: .venv/bin/python -m pytest -q tests/integration/test_linux_package_metadata.py tests/integration/test_multiplatform_package_metadata.py
      - name: Gerar DEB
        run: packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: finance-assist-linux-ubuntu-22.04-amd64
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/views-linux.json
          if-no-files-found: error

  linux-deb-install:
    name: Ubuntu ${{ matrix.ubuntu }} - instalar DEB
    needs: linux-deb
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: finance-assist-linux-ubuntu-22.04-amd64
          path: deb-artifact
      - name: Criar banco sentinela no checkout
        run: |
          python3 -c 'import sqlite3; db=sqlite3.connect("financeiro.db"); db.execute("CREATE TABLE sentinela_origem (valor TEXT)"); db.execute("INSERT INTO sentinela_origem VALUES (\"NAO_COPIAR\")"); db.commit(); db.close()'
          EXISTING_DB="${RUNNER_TEMP}/finance-assist-existing-home/.financeassist/financeiro.db"
          mkdir -p "$(dirname "${EXISTING_DB}")"
          TEST_DB="${EXISTING_DB}" python3 -c 'import os, sqlite3; db=sqlite3.connect(os.environ["TEST_DB"]); db.execute("CREATE TABLE preservado_atualizacao (valor TEXT NOT NULL)"); db.execute("INSERT INTO preservado_atualizacao VALUES (\"MANTER\")"); db.commit(); db.close()'
      - name: Instalar exatamente o DEB gerado no Ubuntu 22.04
        run: |
          cd deb-artifact
          sha256sum -c finance-assist_*.deb.sha256
          sudo apt install -y ./finance-assist_*.deb
      - name: Validar inicialização e banco limpo
        run: |
          CLEAN_HOME="${RUNNER_TEMP}/finance-assist-clean-home"
          mkdir -p "${CLEAN_HOME}"
          set +e
          timeout 15s env HOME="${CLEAN_HOME}" QT_QPA_PLATFORM=offscreen finance-assist-test
          APP_STATUS=$?
          set -e
          test "${APP_STATUS}" -eq 124
          test -f "${CLEAN_HOME}/.financeassist/financeiro.db"
          TEST_DB="${CLEAN_HOME}/.financeassist/financeiro.db" python3 -c 'import os, sqlite3; db=sqlite3.connect(os.environ["TEST_DB"]); tables={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type=\"table\"")}; assert "usuarios" in tables; assert "sentinela_origem" not in tables; assert db.execute("SELECT COUNT(*) FROM usuarios").fetchone()[0] == 0; assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; db.close()'
          EXISTING_HOME="${RUNNER_TEMP}/finance-assist-existing-home"
          set +e
          timeout 15s env HOME="${EXISTING_HOME}" QT_QPA_PLATFORM=offscreen finance-assist-test
          APP_STATUS=$?
          set -e
          test "${APP_STATUS}" -eq 124
          TEST_DB="${EXISTING_HOME}/.financeassist/financeiro.db" python3 -c 'import os, sqlite3; db=sqlite3.connect(os.environ["TEST_DB"]); assert db.execute("SELECT valor FROM preservado_atualizacao").fetchone()[0] == "MANTER"; assert db.execute("SELECT COUNT(*) FROM usuarios").fetchone()[0] == 0; assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; db.close()'
      - name: Testar todas as views do executável instalado
        run: |
          sudo apt install -y xvfb xauth
          QT_QPA_PLATFORM=xcb xvfb-run -a timeout 600s finance-assist-test --self-test-views --self-test-ocr --self-test-report "${RUNNER_TEMP}/views.json"
          python3 -c 'import json, os; r=json.load(open(os.environ["RUNNER_TEMP"] + "/views.json")); assert r["ok"]; assert "views.resumo_financeiro_view.ResumoFinanceiroView" in r["checked"]'
          pdftoppm -v
          tesseract --list-langs | grep -x por

  windows-zip:
    name: Windows x64 - ZIP de teste
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Ambiente Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          .venv\Scripts\python.exe -m pip install pytest
      - name: Testes de empacotamento
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q tests/integration/test_multiplatform_package_metadata.py
      - name: Gerar pacote Windows
        shell: pwsh
        run: packaging\windows\build_windows.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: finance-assist-windows-x64
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
            dist/views-windows.json
            dist/views-windows.json.*.log
          if-no-files-found: error
