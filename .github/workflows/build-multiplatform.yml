name: Build multiplataforma de teste

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-test.*"

permissions:
  contents: read

jobs:
  linux-deb:
    name: Ubuntu 22.04 - DEB amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libdbus-1-3 libfontconfig1 libgl1 libglib2.0-0 libx11-6 libxcb1 libxcb-xinerama0 libxext6 libxkbcommon-x11-0 libxrender1
      - name: Ambiente Python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest
      - name: Testes de empacotamento
        run: .venv/bin/python -m pytest -q tests/integration/test_linux_package_metadata.py tests/integration/test_multiplatform_package_metadata.py
      - name: Gerar DEB
        run: packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: finance-assist-linux-ubuntu-22.04-amd64
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  windows-zip:
    name: Windows x64 - ZIP de teste
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ambiente Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          .venv\Scripts\python.exe -m pip install pytest
      - name: Testes de empacotamento
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q tests/integration/test_multiplatform_package_metadata.py
      - name: Gerar pacote Windows
        shell: pwsh
        run: packaging\windows\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: finance-assist-windows-x64
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
          if-no-files-found: error
